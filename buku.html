        // 1. Firebase init, session check, state, DOM refs, toast,

        //    buildSaldoTransaksi, loadKasData, renderKasTable,
        //    updateClosingKas, loadTunaiData, loadBankData, loadPajakData,

        //    SEMUA TETAP SAMA SEPERTI FILE ANDA.
        //    Saya hanya menambahkan/modifikasi bagian PREVIEW & PRINT.
        // ================================================================

        // ─── Semua kode yang sudah ada dari file Anda (Firebase, load data, dll.) ───

        // ================================================================

        // ================================================================

        /**
         * Membagi konten HTML menjadi beberapa halaman A4 berdasarkan tinggi.
         * @param {string} htmlString - HTML lengkap dari satu halaman (tanpa pagination).
         * @returns {string[]} Array HTML untuk setiap halaman.
         */
        function paginateContent(htmlString) {
            const container = document.createElement('div');
            container.style.cssText =
                'position: absolute; left: -9999px; top: -9999px; width: 210mm; padding: 10mm; box-sizing: border-box; background: white; font-family: "Inter", sans-serif;';
            document.body.appendChild(container);
            container.innerHTML = htmlString;

            const header = container.querySelector('.book-header');
            const meta = container.querySelector('.book-meta');
            const table = container.querySelector('table.book-table');
            const closing = container.querySelector('.closing-statement');
            const signature = container.querySelector('.signature');

            if (!table) {
                document.body.removeChild(container);
                return [htmlString];
            }

            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            const tfoot = table.querySelector('tfoot');
            const rows = tbody ? tbody.querySelectorAll('tr') : [];

            const pageHeightPx = 297 * 3.779527;
            const paddingPx = 10 * 3.779527 * 2;
            const maxContentHeight = pageHeightPx - paddingPx;

            const pages = [];
            const rowsArray = Array.from(rows);

            if (rowsArray.length === 0) {
                document.body.removeChild(container);
                return [htmlString];
            }

            function buildPage(rowIndexStart, rowIndexEnd, isLastPage) {
                const pageDiv = document.createElement('div');
                pageDiv.style.cssText =
                    'width: 210mm; padding: 10mm; box-sizing: border-box; background: white; font-family: "Inter", sans-serif;';

                if (rowIndexStart === 0) {
                    if (header) pageDiv.appendChild(header.cloneNode(true));
                    if (meta) pageDiv.appendChild(meta.cloneNode(true));
                }

                const newTable = document.createElement('table');
                newTable.className = 'book-table';
                if (thead) {
                    const newThead = thead.cloneNode(true);
                    newThead.querySelectorAll('.col-resizer').forEach(el => el.remove());
                    newTable.appendChild(newThead);
                }
                const newTbody = document.createElement('tbody');
                for (let i = rowIndexStart; i <= rowIndexEnd && i < rowsArray.length; i++) {
                    const rowClone = rowsArray[i].cloneNode(true);
                    newTbody.appendChild(rowClone);
                }
                newTable.appendChild(newTbody);
                if (tfoot && isLastPage) {
                    const newTfoot = tfoot.cloneNode(true);
                    newTable.appendChild(newTfoot);
                }
                pageDiv.appendChild(newTable);

                if (isLastPage) {
                    if (closing) pageDiv.appendChild(closing.cloneNode(true));
                    if (signature) pageDiv.appendChild(signature.cloneNode(true));
                }
                return pageDiv.innerHTML;
            }

            function measureHeight(html) {
                const tmp = document.createElement('div');
                tmp.style.cssText =
                    'position: absolute; left: -9999px; top: -9999px; width: 210mm; padding: 10mm; box-sizing: border-box; background: white; font-family: "Inter", sans-serif;';
                document.body.appendChild(tmp);
                tmp.innerHTML = html;
                const height = tmp.offsetHeight;
                document.body.removeChild(tmp);
                return height;
            }

            let currentStart = 0;
            const totalRows = rowsArray.length;

            while (currentStart < totalRows) {
                let end = currentStart;
                let lastValidEnd = currentStart;
                let isLastPage = false;

                while (end < totalRows) {
                    const html = buildPage(currentStart, end, false);
                    const h = measureHeight(html);
                    if (h <= maxContentHeight) {
                        lastValidEnd = end;
                        end++;
                    } else {
                        break;
                    }
                }

                if (lastValidEnd < currentStart) {
                    lastValidEnd = currentStart;
                }

                if (lastValidEnd >= totalRows - 1) {
                    isLastPage = true;
                }

                const pageHtml = buildPage(currentStart, lastValidEnd, isLastPage);
                pages.push(pageHtml);
                currentStart = lastValidEnd + 1;
            }

            document.body.removeChild(container);
            if (pages.length === 0) return [htmlString];
            return pages;
        }

        // ─── Override showPrintPreview agar menggunakan pagination ───
        const originalShowPrintPreview = window.showPrintPreview || function() {};
        window.showPrintPreview = function(type) {
            let rawHtml = '';
            if (type === 'kas') rawHtml = buildA4PreviewKas();
            else if (type === 'tunai') rawHtml = buildA4PreviewTunai();
            else if (type === 'bank') rawHtml = buildA4PreviewBank();
            else if (type === 'pajak') rawHtml = buildA4PreviewPajak();
            else if (type === 'utang') rawHtml = buildA4PreviewUtang();
            else if (type === 'rob') rawHtml = buildA4PreviewRob();
            else return;

            const pages = paginateContent(rawHtml);
            const previewBody = document.getElementById('printPreviewBody');
            previewBody.innerHTML = '';
            pages.forEach((pageHtml, index) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page';
                pageDiv.setAttribute('data-page', index + 1);
                pageDiv.innerHTML = pageHtml;
                previewBody.appendChild(pageDiv);
            });

            const overlay = document.getElementById('printPreviewOverlay');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Inisialisasi resizer untuk setiap halaman
            setTimeout(() => initPreviewResizers(), 100);
        };

        // ─── Override doPrint ───
        window.doPrint = function() {
            const toolbar = document.querySelector('.print-preview-toolbar');
            if (toolbar) toolbar.style.display = 'none';
            window.print();
            setTimeout(() => {
                if (toolbar) toolbar.style.display = 'flex';
            }, 500);
        };

        // ─── Fungsi initPreviewResizers (diperbarui untuk semua halaman) ───
        function initPreviewResizers() {
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach(page => {
                const table = page.querySelector('table.book-table');
                if (!table) return;
                const headers = table.querySelectorAll('thead th');
                headers.forEach(th => {
                    const colKey = th.textContent.trim();
                    const oldResizer = th.querySelector('.col-resizer');
                    if (oldResizer) oldResizer.remove();
                    const resizer = document.createElement('span');
                    resizer.className = 'col-resizer';
                    resizer.dataset.col = colKey;
                    th.style.position = 'relative';
                    th.appendChild(resizer);
                    if (previewColumnWidths && previewColumnWidths[colKey]) {
                        th.style.width = previewColumnWidths[colKey] + 'px';
                        th.style.minWidth = previewColumnWidths[colKey] + 'px';
                    }
                    resizer.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const startX = e.clientX;
                        const startWidth = th.offsetWidth;
                        document.body.classList.add('dragging-active');
                        const onMouseMove = (ev) => {
                            const diff = ev.clientX - startX;
                            const newWidth = Math.max(40, startWidth + diff);
                            th.style.width = newWidth + 'px';
                            th.style.minWidth = newWidth + 'px';
                            previewColumnWidths[colKey] = newWidth;
                            savePreviewColumnWidths();
                        };
                        const onMouseUp = () => {
                            document.body.classList.remove('dragging-active');
                            document.removeEventListener('mousemove', onMouseMove);
                            document.removeEventListener('mouseup', onMouseUp);
                        };
                        document.addEventListener('mousemove', onMouseMove);
                        document.addEventListener('mouseup', onMouseUp);
                    });
                });
            });
        }

        // ─── Variabel previewColumnWidths dan fungsi simpan/load ───
        let previewColumnWidths = {};
        function loadPreviewColumnWidths() {
            try {
                const saved = localStorage.getItem('bosnbs_preview_col_widths');
                if (saved) previewColumnWidths = JSON.parse(saved);
                else previewColumnWidths = {};
            } catch (e) { previewColumnWidths = {}; }
        }
        function savePreviewColumnWidths() {
            try {
                localStorage.setItem('bosnbs_preview_col_widths', JSON.stringify(previewColumnWidths));
            } catch (e) { /* ignore */ }
        }

        // ─── Pastikan event listener tetap menggunakan fungsi baru ───
        // (Saya tidak mengubah event listener karena sudah memanggil showPrintPreview)
        // Namun jika ada yang memanggil showPrintPreview langsung, sudah tertimpa.

        // ─── Init ───
        // ... semua init yang sudah ada tetap dipanggil ...
        // Saya hanya menambahkan loadPreviewColumnWidths di awal
        loadPreviewColumnWidths();

        // Lanjutkan dengan init lainnya seperti biasa (loadSettings, set bulan, dll.)
        // ... (kode init dari file Anda) ...

        console.log('📋 BOS-NBS · Buku dengan pagination A4 siap');
        console.log('✅ Preview multi-halaman dengan background abu-abu');
        console.log('✅ Print identik dengan preview');
        console.log(`ℹ️  Session: ${sessionJenjang} · ${sessionTahun}`);
    </script>
